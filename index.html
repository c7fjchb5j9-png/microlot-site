<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F3ECE2">
    <meta name="format-detection" content="telephone=no">
    <!--head-->
    <script>
      // Прячем буквы до анимации только если JS включён и движение разрешено.
      // Страховка: через 2.5 с всё показывается, даже если скрипт не загрузился.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('motion');
          setTimeout(function () { d.classList.add('motion-ready'); }, 2500);
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <!--app-->
  </body>
</html>
